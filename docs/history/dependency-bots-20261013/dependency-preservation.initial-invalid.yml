# FR// Contrôle de conservation indépendant du bot, sans secret ni installation du projet.
# EN// Bot-independent preservation check, without secrets or project installation.
name: Conservation des dépendances
on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: dependency-preservation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preservation:
    name: Dépendances et archives conservées / Dependencies and archives retained
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parseur YAML isolé / Isolated YAML parser
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps PyYAML==6.0.3
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: reference
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Comparer à la vraie base / Compare against actual base
        env:
          PR_ACTOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          checker=reference/Scripts/check-dependency-update-preservation.py
          if [ ! -f "$checker" ]; then
            # FR// Amorçage explicite : la première PR doit être relue, la base ne possède pas encore le contrôleur.
            # EN// Explicit bootstrap: the first PR needs review because the base does not contain the checker yet.
            checker=candidate/Scripts/check-dependency-update-preservation.py
            echo "::warning::Amorçage du contrôleur depuis la PR / Bootstrapping checker from the PR"
          fi
          python "$checker" --base reference --candidate candidate --actor-type "$PR_ACTOR_TYPE" --branch "$PR_HEAD_BRANCH"
      - name: Régressions du contrôleur / Checker regressions
        run: python -m unittest discover -s candidate/tests/dependency_updates -p 'test_*.py' -v

  renovate:
    name: Valider la configuration Renovate / Validate Renovate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # FR// Outil de validation isolé ; aucune installation ou mise à jour des dépendances applicatives.
      # EN// Isolated validator; no installation or update of application dependencies.
      - name: Validateur officiel Renovate / Official Renovate validator
        run: pnpm --package=renovate@44.155.7 dlx renovate-config-validator --strict renovate.json
