# FR// Contrôle de conservation indépendant du bot, sans secret ni installation du projet.
# EN// Bot-independent preservation check, without secrets or project installation.
name: Conservation des dépendances
on:
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: dependency-preservation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preservation:
    name: Dépendances et archives conservées / Dependencies and archives retained
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parseur YAML isolé / Isolated YAML parser
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps PyYAML==6.0.3'
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: reference
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      # FR// Amorçage limité à #153 : les migrations antérieures restent documentées, sans réactivation.
      # EN// Bootstrap limited to #153: earlier migrations stay documented without reactivation.
      - uses: actions/checkout@v6
        if: ${{ hashFiles('reference/Scripts/check-dependency-update-preservation.py') == '' && github.event.pull_request.number == 153 && github.event.pull_request.base.sha == 'c39a87e1d693382f34ca38bcaa68e032a9bcbc29' }}
        with:
          ref: c0169878bbd24ba28bc17c1886bb4eada464bf39
          path: bootstrap
          persist-credentials: false
      - name: Comparer à la référence contrôlée / Compare against controlled reference
        env:
          PR_ACTOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          checker=reference/Scripts/check-dependency-update-preservation.py
          comparison_base=reference
          if [ ! -f "$checker" ]; then
            # FR// La vraie base reste obligatoire hors de l'unique amorçage explicitement borné.
            # EN// The actual base remains mandatory outside the single explicitly bounded bootstrap.
            test "$PR_NUMBER" = 153
            test "$PR_BASE_SHA" = c39a87e1d693382f34ca38bcaa68e032a9bcbc29
            test -f bootstrap/package.json
            checker=candidate/Scripts/check-dependency-update-preservation.py
            comparison_base=bootstrap
            echo "::warning::Amorçage #153 sur c016987 ; écarts antérieurs à relire / Bootstrap #153 against c016987; review earlier differences"
          fi
          python "$checker" --base "$comparison_base" --candidate candidate --actor-type "$PR_ACTOR_TYPE" --branch "$PR_HEAD_BRANCH"
      - name: Régressions du contrôleur / Checker regressions
        run: python -m unittest discover -s candidate/tests/dependency_updates -p 'test_*.py' -v
      # FR// La vraie base est aussi contrôlée ; l'amorçage ne valide aucune perte antérieure.
      # EN// Also check the actual base; bootstrap validates no earlier removal.
      - name: Écarts historiques contre la vraie base / Historical gaps against actual base
        run: python candidate/Scripts/check-historical-dependency-gaps.py --base reference --candidate candidate

  historical-tools:
    name: Outils historiques et verrou reproductible / Historical tools and reproducible lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installation gelée / Frozen install
        run: pnpm install --frozen-lockfile
      - name: Conservation JS / JS preservation
        run: pnpm run check:dependencies
      - name: Outils et modules compilés / Tools and compiled modules
        run: node --test tests/dependency_updates/historical-tools.test.cjs
      # FR// Une résolution pnpm réelle doit reproduire exactement le verrou, sans scripts.
      # EN// Actual pnpm resolution must reproduce the exact lock without scripts.
      - name: Reproductibilité du verrou / Lock reproducibility
        run: |
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          git diff --exit-code -- package.json pnpm-lock.yaml

  renovate:
    name: Valider la configuration Renovate / Validate Renovate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # FR// Outil de validation isolé ; aucune installation ou mise à jour des dépendances applicatives.
      # EN// Isolated validator; no installation or update of application dependencies.
      - name: Validateur officiel Renovate / Official Renovate validator
        run: pnpm --package=renovate@44.155.7 dlx renovate-config-validator --strict renovate.json
