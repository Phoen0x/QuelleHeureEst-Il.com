# manage rules, file ignores, notifications, and more.
#
# See https://semgrep.dev/docs

name: Semgrep

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '39 7 * * 4'

permissions:
  contents: read

# FR// Configuration explicite ; les contrôles non exécutés sont signalés ignorés.
# EN// Explicit configuration; checks that do not run are reported skipped.
jobs:
  semgrep:
    if: ${{ vars.SEMGREP_ENABLED == 'true' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Scan
    runs-on: ubuntu-latest
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    steps:
      # Checkout project source
      - uses: actions/checkout@v6
      - name: Vérifier le jeton / Check token
        run: |
          if [ -z "$SEMGREP_APP_TOKEN" ]; then
            echo "::error::SEMGREP_APP_TOKEN requis / SEMGREP_APP_TOKEN required"
            exit 1
          fi
      # FR// L'action historique est conservée dans docs/history ; le CLI actuel propage les erreurs.
      # EN// The historical action is retained in docs/history; the current CLI propagates errors.
      - name: Installer Semgrep / Install Semgrep
        run: python3 -m pip install 'semgrep==1.180.0'
      - name: Scan code
        run: semgrep ci --metrics=off --exclude=docs/history --sarif --output=semgrep.sarif
      # Upload SARIF file generated in previous step
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' }}
