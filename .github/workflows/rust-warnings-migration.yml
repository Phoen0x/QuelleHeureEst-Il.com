# FR// Candidat isolé : conserver les avertissements et tester le correctif de mémoire glib.
# EN// Isolated candidate: retain warnings and test the glib memory-safety fix.
name: Validation des avertissements Rust
on:
  workflow_dispatch:
  # FR// Déclencheur initial conservé désactivé après validation du candidat.
  # EN// Initial trigger retained disabled after candidate validation.
  # push:
  #   branches: [ "chore/ci-phase1-reliability-20261013" ]
  #   paths:
  #     - '.github/workflows/rust-warnings-migration.yml'
  #     - 'Scripts/prepare-rust-warnings-candidate.py'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # FR// Refuser l’état incompatible avant toute restauration ou opération de génération.
      # EN// Refuse incompatible state before any restoration or generation operation.
      - name: Référence compatible sans écriture / Compatible baseline without writes
        run: python3 Scripts/candidate_safety.py --check rust-warnings
      - name: Dépendances natives / Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Frontend embarqué / Embedded frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run vite:build
      # FR// Rejouer la migration depuis les références, seulement dans le runner.
      # EN// Replay migration from references, only in the runner.
      - name: Références initiales / Original references
        run: |
          cp docs/history/rust-warnings-20261013/Cargo.lock Cargo.lock
          cp docs/history/rust-warnings-20261013/Cargo.toml Cargo.toml
          cp docs/history/rust-warnings-20261013/src-tauri/Cargo.toml src-tauri/Cargo.toml
      - name: Chaînes initiales et incompatibilité / Original chains and incompatibility
        run: |
          cargo tree --locked --target all --all-features -i proc-macro-error
          cargo tree --locked --target all --all-features -i rustls-pemfile
          cargo tree --locked --target all --all-features -i glib
          if cargo update -p glib --precise 0.20.0; then
            echo "Migration inattendue à revoir / Unexpected migration to review"
            exit 1
          fi
          git diff --exit-code -- Cargo.lock Cargo.toml src-tauri/Cargo.toml
      - name: Préparer le rétroport / Prepare backport
        run: python3 Scripts/prepare-rust-warnings-candidate.py --generate
      - name: Format des nouveaux tests / New test formatting
        run: rustfmt --edition 2021 src-tauri/tests/glib_variant_str_iter.rs
      - name: Conservation et rétroport / Preservation and backport
        run: |
          python3 Scripts/check-rust-warnings-backport.py
          python3 Scripts/check-rust-h2-migration.py
          cargo tree --locked --target all --all-features -i glib
      - name: Format Rust / Rust formatting
        run: cargo fmt --all -- --check
      - name: Compilation debug / Debug build
        run: cargo build --workspace --locked
      - name: Tests debug / Debug tests
        run: cargo test --workspace --locked
      - name: Clippy strict / Strict Clippy
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - name: Compilation release / Release build
        run: cargo build --workspace --release --locked
      - name: Tests release / Release tests
        run: cargo test --workspace --release --locked
      - name: Exclusion des références / Reference exclusion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          markers = (b'RUST_WARNINGS_BUNDLE_BEGIN', b'LOCKFILE_CANDIDATE_BEGIN', b'RUSTFMT_BEGIN:', b'lockfileVersion:', b'https://brokencrystals.com')
          for path in list(Path('dist').rglob('*')) + [Path('target/release/quelleheureest')]:
              if path.is_file():
                  assert not any(marker in path.read_bytes() for marker in markers), str(path)
          PY
      - name: Installer cargo-audit / Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Cargo audit standard
        run: cargo audit
      - name: Audit strict et visibilité / Strict audit and visibility
        id: audit
        continue-on-error: true
        run: |
          cargo audit --json > "$RUNNER_TEMP/rust-warnings-audit.json"
          cat "$RUNNER_TEMP/rust-warnings-audit.json"
          cargo audit --deny warnings
      - name: Cargo-deny sans changement de politique / Cargo-deny without policy change
        id: deny
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          rust-version: stable
          command: check
          arguments: ''
      - name: Exporter les sources validables / Export reviewable sources
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, json
          paths = [Path(p) for p in ('Cargo.lock', 'Cargo.toml', 'src-tauri/Cargo.toml', 'src-tauri/tests/glib_variant_str_iter.rs', '.cargo/config.toml', 'docs/history/rust-warnings-20261013/glib-0.18.5.crate')]
          paths += sorted(Path('vendor/glib-0.18.5').rglob('*'))
          files = {}
          for path in paths:
              if path.is_file():
                  files[path.as_posix()] = base64.b64encode(path.read_bytes()).decode()
          data = base64.b64encode(gzip.compress(json.dumps(files).encode(), mtime=0)).decode()
          print('RUST_WARNINGS_BUNDLE_BEGIN')
          for start in range(0, len(data), 60000):
              print(data[start:start+60000])
          print('RUST_WARNINGS_BUNDLE_END')
          print('RUST_WARNINGS_EXPORT_FILES', len(files))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-warnings-candidate
          path: |
            Cargo.lock
            Cargo.toml
            .cargo/config.toml
            src-tauri/Cargo.toml
            src-tauri/tests/glib_variant_str_iter.rs
            vendor/glib-0.18.5
            docs/history/rust-warnings-20261013/glib-0.18.5.crate
      # FR// Les diagnostics continuent pour exporter les preuves, mais les audits restent bloquants.
      # EN// Diagnostics continue to export evidence, but audits remain blocking.
      - name: Bilan des audits / Audit outcomes
        if: always()
        env:
          AUDIT_RESULT: ${{ steps.audit.outcome }}
          DENY_RESULT: ${{ steps.deny.outcome }}
        run: |
          echo "cargo audit --deny warnings: $AUDIT_RESULT; cargo deny: $DENY_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$AUDIT_RESULT" = success
          test "$DENY_RESULT" = success
