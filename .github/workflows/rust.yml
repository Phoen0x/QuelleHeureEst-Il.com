name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CARGO_BUILD_JOBS: 2

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '24.19.0'
    - name: Install pnpm
      run: npm install --global pnpm@8.15.9
    - name: Install native build prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
    - name: Select the validated Rust toolchain
      run: |
        rustup toolchain install 1.99.1 --profile minimal
        rustup default 1.99.1
    - name: Install frozen frontend dependencies
      run: pnpm install --frozen-lockfile
    - name: Check dependency preservation
      run: node docs/validation/rust-178/check-ported-graph.cjs
    - name: Check and test the frontend
      run: |
        pnpm run typecheck
        pnpm run lint
        pnpm test
        pnpm run vite:build
    - name: Build
      run: cargo build --workspace --locked --verbose
    - name: Run tests
      run: cargo test --workspace --locked --verbose
