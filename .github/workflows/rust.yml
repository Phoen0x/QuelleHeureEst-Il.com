# FR// Compilation de Tauri 2 avec les bibliothèques système Linux.
# ENG// Compile Tauri 2 with Linux system libraries.
name: Rust
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Linux native dependencies / Dépendances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run vite:build
      - name: Build Rust
        run: cargo build --workspace --verbose
      - name: Test Rust
        run: cargo test --workspace --verbose
