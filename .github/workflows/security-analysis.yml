name: "🔒 Security & Quality Analysis"

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly: Sunday 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # =============================================================================
  # 1. CodeQL - Multi-language SAST (Rust, JS/TS, Actions)
  # =============================================================================
  codeql-analysis:
    name: "🔍 CodeQL Analysis"
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
          db-finalize-extra-args: '--no-source-code-error'

  # =============================================================================
  # 2. Semgrep - Pattern-based SAST
  # =============================================================================
  semgrep-scan:
    name: "🔎 Semgrep Security Patterns"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          publishDeployment: ${{ secrets.SEMGREP_DEPLOYMENT_ID }}
          generateSarif: "1"
        continue-on-error: true

      - name: Upload Semgrep SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # =============================================================================
  # 3. SonarCloud - Code Quality & Coverage
  # =============================================================================
  sonarcloud-analysis:
    name: "📊 SonarCloud Code Quality"
    # FR// Analyse externe uniquement quand elle est configurée.
    # ENG// Run external analysis only when configured.
    if: ${{ vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORG != '' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORG }}

  # =============================================================================
  # 4. Rust Security - Dependency & Vulnerability Scanning
  # =============================================================================
  rust-security-audit:
    name: "🦀 Rust: Security Audit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo-audit (vulnerability scan)
        # FR// Ancienne tolérance conservée en référence ; les alertes restent désormais bloquantes.
        # EN// Former tolerance retained as reference; advisories now remain blocking.
        # continue-on-error: true
        run: cargo audit --deny warnings

  # =============================================================================
  # 5. Rust Dependency Scanning (cargo-deny)
  # =============================================================================
  rust-dependency-check:
    name: "🦀 Rust: Dependency Analysis"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run cargo-deny (dependency check)
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          log-level: warn
          command: check
          # FR// --all-targets n'est pas une option cargo-deny ; toutes les cibles sont analysées par défaut.
          # EN// --all-targets is not a cargo-deny option; all targets are analyzed by default.
          # arguments: --all-targets
          arguments: ''
        # FR// Ancienne tolérance : les erreurs de l'outil ne doivent pas apparaître en succès.
        # EN// Former tolerance: tool errors must not appear successful.
        # continue-on-error: true

  # =============================================================================
  # 6. Rust Code Quality (Clippy + Format Check)
  # =============================================================================
  rust-quality:
    name: "🦀 Rust: Code Quality"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # FR// Préparer Tauri sur Linux ; les échecs de compilation restent bloquants.
      # EN// Prepare Tauri on Linux; compilation failures remain blocking.
      - name: Dépendances natives Linux / Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev

      - name: Install Rust with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # FR// generate_context! embarque le frontend ; construire les sources actives.
      # EN// generate_context! embeds the frontend; build active sources.
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Frontend embarqué / Embedded frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run vite:build

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code format (rustfmt)
        id: format
        run: cargo fmt --all -- --check

      # FR// Export de diagnostic pour corriger le format sans altérer les sources historiques.
      # EN// Diagnostic export to fix formatting without altering historical sources.
      - name: Format Rust proposé / Proposed Rust formatting
        if: failure() && steps.format.outcome == 'failure'
        run: |
          for source in src-tauri/src/*.rs; do
            echo "RUSTFMT_BEGIN:$source"
            rustfmt --edition 2021 --emit stdout < "$source"
            echo "RUSTFMT_END:$source"
          done

      - name: Run clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

  # =============================================================================
  # 7. Rust Build & Test
  # =============================================================================
  rust-build-test:
    name: "🦀 Rust: Build & Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # FR// Préparer Tauri sur Linux ; les échecs de compilation restent bloquants.
      # EN// Prepare Tauri on Linux; compilation failures remain blocking.
      - name: Dépendances natives Linux / Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # FR// generate_context! embarque le frontend ; construire les sources actives.
      # EN// generate_context! embeds the frontend; build active sources.
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Frontend embarqué / Embedded frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run vite:build

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Rust project
        run: cargo build --workspace --verbose

      - name: Run unit tests
        run: cargo test --workspace --verbose

      - name: Run doc tests
        # FR// Le paquet est actuellement binaire ; signaler l'absence de doctests.
        # EN// The package is currently binary-only; report absent doctests.
        run: |
          if cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if any("lib" in t["kind"] for p in d["packages"] for t in p["targets"]) else 1)'; then
            cargo test --workspace --doc --verbose
          else
            echo "Doctests ignorés : aucune bibliothèque Rust / Doctests skipped: no Rust library" >> "$GITHUB_STEP_SUMMARY"
          fi

  # =============================================================================
  # 8. JavaScript/TypeScript Security (pnpm audit)
  # =============================================================================
  js-security:
    name: "📦 JS/TS: Dependency Security"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # FR// pnpm 8 est compatible avec le lockfile v6.
      # ENG// pnpm 8 supports the v6 lockfile.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate

  # =============================================================================
  # 9. Kotlin/Android Security (Android Lint)
  # =============================================================================
  android-lint:
    name: "📱 Kotlin/Android: Lint Analysis"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Android Lint
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew lint --continue
          else
            echo "⚠️ No Android project found (gradlew not detected)"
          fi
        continue-on-error: true

  # =============================================================================
  # 10. OWASP Dependency-Check (Multi-platform dependencies)
  # =============================================================================
  owasp-dependency-check:
    name: "🛡️ OWASP: Dependency Check"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'QuelleHeureEst-Il'
          path: '.'
          format: 'SARIF'
          args: >
            --enableExperimental
            --enableRetired
        continue-on-error: true

      - name: Upload OWASP results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'dependency-check-report.sarif'
        continue-on-error: true

  # =============================================================================
  # 11. Analysis Summary Report
  # =============================================================================
  analysis-summary:
    name: "📋 Security & Quality Report"
    runs-on: ubuntu-latest
    needs: 
      - codeql-analysis
      - semgrep-scan
      - sonarcloud-analysis
      - rust-security-audit
      - rust-dependency-check
      - rust-quality
      - rust-build-test
      - js-security
      - android-lint
      - owasp-dependency-check
    if: always()

    steps:
      - name: Generate comprehensive summary
        run: |
          cat << 'EOF'
          
          ╔════════════════════════════════════════════════════════════════════════════════╗
          ║              🔒 MULTI-PLATFORM SECURITY & QUALITY ANALYSIS SUMMARY             ║
          ╚════════════════════════════════════════════════════════════════════════════════╝
          
          📊 SECURITY & SAST TOOLS:
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ✅ CodeQL (GitHub Native SAST)
             • Languages: Rust, JavaScript/TypeScript, GitHub Actions
             • Status: ${{ needs.codeql-analysis.result }}
          
          ✅ Semgrep (Pattern-Based Security Scanning)
             • Scans: Custom security patterns across all languages
             • Status: ${{ needs.semgrep-scan.result }}
             • Config: Requires SEMGREP_APP_TOKEN & SEMGREP_DEPLOYMENT_ID
          
          ✅ SonarCloud (Code Quality & Hotspots)
             • Coverage: Multi-language quality metrics
             • Status: ${{ needs.sonarcloud-analysis.result }}
             • Config: Requires SONAR_TOKEN, SONAR_PROJECT_KEY, SONAR_ORG
          
          ✅ OWASP Dependency-Check
             • Checks: Known vulnerabilities in all dependencies
             • Status: ${{ needs.owasp-dependency-check.result }}
          
          🦀 RUST-SPECIFIC SECURITY:
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ✅ cargo-audit
             • Checks: Known security vulnerabilities in crate dependencies
             • Status: ${{ needs.rust-security-audit.result }}
          
          ✅ cargo-deny
             • Checks: License compliance, advisories, banned crates
             • Status: ${{ needs.rust-dependency-check.result }}
          
          ✅ Clippy
             • Checks: Code quality, performance, security patterns
             • Status: ${{ needs.rust-quality.result }}
          
          ✅ rustfmt
             • Checks: Code formatting standards compliance
             • Status: ${{ needs.rust-quality.result }}
          
          ✅ Rust Tests
             • Unit Tests & Doc Tests
             • Status: ${{ needs.rust-build-test.result }}
          
          📦 JAVASCRIPT/TYPESCRIPT SECURITY:
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ✅ pnpm audit
             • Checks: Vulnerable packages in pnpm dependencies
             • Status: ${{ needs.js-security.result }}
          
          📱 KOTLIN/ANDROID SECURITY:
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ✅ Android Lint
             • Checks: Security issues, best practices, potential bugs
             • Status: ${{ needs.android-lint.result }}
          
          🔧 BUILD & COMPILATION:
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          ✅ Cargo Build (Rust)
             • Status: ${{ needs.rust-build-test.result }}
          
          ✅ Tests (All Platforms)
             • Rust: Unit tests, Doc tests
             • Status: ${{ needs.rust-build-test.result }}
          
          ⚙️ CONFIGURATION REQUIRED (OPTIONAL):
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          To enable optional analysis tools, add these secrets:
          Settings → Secrets and variables → Actions → New repository secret
          
          📌 Semgrep:
             • SEMGREP_APP_TOKEN (get at: https://semgrep.dev)
             • SEMGREP_DEPLOYMENT_ID
          
          📌 SonarCloud:
             • SONAR_TOKEN (get at: https://sonarcloud.io)
             • SONAR_PROJECT_KEY
             • SONAR_ORG
          
          🚀 TRIGGERED BY:
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          • Every push (any branch)
          • Every pull request (any branch)
          • Weekly: Every Sunday at 2 AM UTC
          • Manual trigger: Actions tab → "Security & Quality Analysis" → Run workflow
          
          📚 ADDITIONAL WORKFLOWS:
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          • Rust (traditional CI): .github/workflows/rust.yml
          • Auto-Approve PRs: .github/workflows/auto-approve.yml
          • NeuraLegion DAST: .github/workflows/bright-dast.yml (when available)
          • APIsec Scanning: .github/workflows/apisec-scan.yml
          
          ╔════════════════════════════════════════════════════════════════════════════════╗
          ║                       ✨ Analysis complete!                                    ║
          ╚════════════════════════════════════════════════════════════════════════════════╝
          
          EOF

      - name: Check critical job statuses
        run: |
          echo ""
          echo "🔍 Job Results Summary:"
          echo "────────────────────────"
          echo "CodeQL: ${{ needs.codeql-analysis.result }}"
          echo "Semgrep: ${{ needs.semgrep-scan.result }}"
          echo "SonarCloud: ${{ needs.sonarcloud-analysis.result }}"
          echo "Rust Audit: ${{ needs.rust-security-audit.result }}"
          echo "Rust Deps: ${{ needs.rust-dependency-check.result }}"
          echo "Rust Quality: ${{ needs.rust-quality.result }}"
          echo "Rust Build: ${{ needs.rust-build-test.result }}"
          echo "JS Security: ${{ needs.js-security.result }}"
          echo "Android Lint: ${{ needs.android-lint.result }}"
          echo "OWASP Check: ${{ needs.owasp-dependency-check.result }}"
