# FR// Valider les sources exactes de #176 sans modifier les fichiers historiques.
# EN// Validate the exact #176 sources without changing historical files.
name: Validation Rust dédiée après 176

on:
  pull_request:
    branches: [fix/rust-tauri2-shell-feature]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 3e1f4177d2c1417b62121559ec9f39e8ca342394
      CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CARGO_TERM_COLOR: never
      CARGO_HTTP_TIMEOUT: '20'
      CARGO_NET_RETRY: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Lire le head exact
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Vérifier la source et préparer la copie temporaire
        id: source
        run: |
          export EVIDENCE_DIR="$RUNNER_TEMP/rust-validation-evidence"
          export BUILD_DIR="$RUNNER_TEMP/rust-validation-build"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/rust-validation-target"
          mkdir -p "$EVIDENCE_DIR" "$BUILD_DIR" "$CARGO_TARGET_DIR"
          printf 'EVIDENCE_DIR=%s\nBUILD_DIR=%s\nCARGO_TARGET_DIR=%s\n' \
            "$EVIDENCE_DIR" "$BUILD_DIR" "$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          python3 docs/validation/rust-176/check.py before

      # FR// Liste reprise de #153, sans importer son workflow ou ses corrections applicatives.
      # EN// Reuse the #153 package list without importing its workflow or application fixes.
      - name: Installer et vérifier les prérequis Linux de 153
        id: native
        run: |
          set -o pipefail
          timeout --kill-after=10s 120s sudo apt-get \
            -o Acquire::Retries=1 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 update 2>&1 | tee "$EVIDENCE_DIR/apt-update.log"
          timeout --kill-after=10s 300s sudo apt-get \
            -o Acquire::Retries=1 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev 2>&1 | tee "$EVIDENCE_DIR/apt-install.log"
          {
            rustc --version --verbose
            cargo --version --verbose
            rustup show active-toolchain
            python3 --version
            uname -a
            pkg-config --modversion glib-2.0 gtk+-3.0 webkit2gtk-4.1
            pkg-config --atleast-version=2.70 glib-2.0
            dpkg-query -W build-essential libwebkit2gtk-4.1-dev \
              libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
          } 2>&1 | tee "$EVIDENCE_DIR/environment.log"

      # FR// La base ne contient pas Cargo.lock ; ne le générer que dans la copie temporaire.
      # EN// The baseline has no Cargo.lock; generate it only in the temporary copy.
      - name: Résoudre et conserver le verrou temporaire
        id: lock
        run: |
          set -o pipefail
          cd "$BUILD_DIR"
          timeout --kill-after=10s 180s cargo generate-lockfile --verbose \
            2>&1 | tee "$EVIDENCE_DIR/resolution.log"
          cp Cargo.lock "$EVIDENCE_DIR/Cargo.lock"
          sha256sum Cargo.lock > "$EVIDENCE_DIR/Cargo.lock.sha256"

      # FR// Préparer les vrais assets avec les versions de #153, sans régénérer les verrous.
      # EN// Prepare real assets with the #153 versions, without regenerating lockfiles.
      - name: Préparer pnpm 8.15.9
        id: pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 8.15.9
          run_install: false

      - name: Préparer Node 22
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Installer avec le verrou gelé
        id: install
        env:
          NPM_CONFIG_FETCH_TIMEOUT: '20000'
          NPM_CONFIG_FETCH_RETRIES: '1'
        run: |
          set -o pipefail
          node --version 2>&1 | tee "$EVIDENCE_DIR/install.log"
          pnpm --version 2>&1 | tee -a "$EVIDENCE_DIR/install.log"
          cd "$BUILD_DIR"
          timeout --kill-after=10s 600s pnpm install --frozen-lockfile \
            2>&1 | tee -a "$EVIDENCE_DIR/install.log"

      # FR// Réutiliser le garde-fou générique intact de #153 et contrôler aussi tous les nœuds orphelins.
      # EN// Reuse the unchanged generic #153 guard and also check every orphan node.
      - name: Vérifier le graphe complet et le portage
        id: graph
        run: |
          set -o pipefail
          cd "$BUILD_DIR"
          timeout --kill-after=5s 60s node docs/validation/rust-178/check-ported-graph.cjs \
            2>&1 | tee "$EVIDENCE_DIR/dependency-graph.log"

      - name: Générer le frontend sans modifier les verrous
        id: frontend
        run: |
          set -o pipefail
          cd "$BUILD_DIR"
          timeout --kill-after=10s 180s pnpm run vite:build \
            2>&1 | tee "$EVIDENCE_DIR/frontend.log"
          test -f dist/index.html

      - name: Compiler Rust debug
        id: build_debug
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.lock.outcome == 'success' }}
        run: |
          set -o pipefail
          cd "$BUILD_DIR"
          timeout --kill-after=10s 900s cargo build --workspace --locked --verbose \
            2>&1 | tee "$EVIDENCE_DIR/build-debug.log"

      # FR// Tenter réellement les tests même après un échec de compilation, sans masquer celui-ci.
      # EN// Actually attempt tests even after compilation fails, without masking that failure.
      - name: Tester Rust debug
        id: test_debug
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.lock.outcome == 'success' }}
        run: |
          set -o pipefail
          cd "$BUILD_DIR"
          timeout --kill-after=10s 900s cargo test --workspace --locked --verbose \
            2>&1 | tee "$EVIDENCE_DIR/test-debug.log"

      - name: Compiler Rust release
        id: build_release
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.lock.outcome == 'success' }}
        run: |
          set -o pipefail
          cd "$BUILD_DIR"
          timeout --kill-after=10s 900s cargo build --workspace --release --locked --verbose \
            2>&1 | tee "$EVIDENCE_DIR/build-release.log"

      - name: Tester Rust release
        id: test_release
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.lock.outcome == 'success' }}
        run: |
          set -o pipefail
          cd "$BUILD_DIR"
          timeout --kill-after=10s 900s cargo test --workspace --release --locked --verbose \
            2>&1 | tee "$EVIDENCE_DIR/test-release.log"

      - name: Contrôler la conservation après exécution
        id: preservation
        if: always()
        run: python3 docs/validation/rust-176/check.py after

      - name: Produire le bilan et refuser toute étape obligatoire manquante
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: python3 docs/validation/rust-176/check.py summary

      - name: Conserver les preuves et les journaux
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-validation-176-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rust-validation-evidence/
          if-no-files-found: error
          retention-days: 14
