# FR// Lint, types et compilation Vite avec l'installation reproductible pnpm.
# ENG// Lint, typecheck and Vite build with reproducible pnpm installation.
name: JS/TS CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: js-ts-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      # FR// Vérifier la conservation des paquets et le correctif de récursion installé.
      # EN// Verify package preservation and the installed recursion patch.
      - name: Dépendances conservées / Dependencies retained
        run: pnpm run check:dependencies
      - name: Régressions de sécurité / Security regressions
        run: pnpm run test:security
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Web build
        run: pnpm run vite:build

  workflows:
    name: Valider les workflows / Validate workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      # FR// Vérifier la syntaxe et les expressions Actions ; les scripts historiques restent intacts.
      # EN// Check Actions syntax and expressions; historical scripts remain intact.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck=
